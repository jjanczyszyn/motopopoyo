name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # convex/_generated is gitignored — regenerate before typechecking.
      - name: Generate Convex types
        run: npx convex codegen --typecheck=disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Typecheck
        run: npm run typecheck

      # e2e/, fixtures/ (slow OCR harness) and tests-local/ are excluded in
      # vite.config.ts — see the `test.exclude` block there.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_CONVEX_URL: https://tough-meadowlark-233.convex.cloud

  # End-to-end against a real production build. Read-only specs — they never
  # create or mutate data in the Convex deployment they read from.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Convex types
        run: npx convex codegen --typecheck=disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          VITE_CONVEX_URL: https://tough-meadowlark-233.convex.cloud
          # Optional: set these repo secrets to also run the signed-in admin
          # specs (bottom tab bar, per-section overflow, season switch).
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
