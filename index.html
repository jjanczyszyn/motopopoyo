<!-- GA opt-out: visit ?ga_optout=1 to disable analytics in this browser, ?ga_optout=0 to re-enable -->
<script>
  (function () {
    var KEY = 'ga_optout', ID = 'G-ER1JWFY44B';
    try {
      var p = new URLSearchParams(location.search);
      if (p.has(KEY)) {
        if (p.get(KEY) === '0') localStorage.removeItem(KEY);
        else localStorage.setItem(KEY, '1');
      }
      if (localStorage.getItem(KEY) === '1') window['ga-disable-' + ID] = true;
    } catch (e) {}
  })();
</script>
<!-- Google tag (gtag.js) -->

<style>
  :root {
    --bg: #ffffff;
    --ink: #0a0a0a;
    --ink-2: #2b2b2b;
    --muted: #767676;
    --line: #ebebeb;
    --line-2: #f3f3f3;
    --chip: #f5f5f5;
    --accent: #ff5a3c;
    --accent-ink: #ffffff;
    --ok: #16a34a;
    --warn: #b45309;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); }
  body, html { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
  #root { height: 100vh; height: 100dvh; width: 100%; }
  @media (max-width: 700px) {
    /* Phone: kill the centered desktop column and let content go edge-to-edge. */
    body { background: #fff; }

<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
  // Track reach-outs and bookings as GA4 events.
  document.addEventListener('click', function (e) {
    var link = e.target.closest('a[href]');
    if (!link || typeof gtag !== 'function') return;
    var href = link.getAttribute('href') || '';
    if (href.indexOf('wa.me') > -1 || href.indexOf('api.whatsapp') > -1 || link.hasAttribute('data-wa')) {
      gtag('event', 'whatsapp_click', { link_url: href });
    } else if (href.indexOf('mailto:') === 0) {
      gtag('event', 'email_click', { link_url: href });
    } else if (href.indexOf('tel:') === 0) {
      gtag('event', 'tel_click', { link_url: href });
    }
  });
</script>
<script>
  // EU cookie consent banner (GA4 Consent Mode). Shown until the visitor chooses.
  (function () {
    if (localStorage.getItem('ga_consent')) return;
    function choose(v) {
      try { localStorage.setItem('ga_consent', v); } catch (e) {}
      if (typeof gtag === 'function') gtag('consent', 'update', { ad_storage: v, ad_user_data: v, ad_personalization: v, analytics_storage: v });
      var el = document.getElementById('ga-consent'); if (el) el.remove();
    }
    function show() {
      if (document.getElementById('ga-consent')) return;
      var bar = document.createElement('div');
      bar.id = 'ga-consent';
      bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#111;color:#fff;font:14px/1.5 system-ui,-apple-system,sans-serif;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center';
      bar.innerHTML = '<span style="max-width:620px">This site uses cookies for analytics. You can accept or decline \u2014 declining keeps your visit cookieless.</span>';
      var ok = document.createElement('button');
      ok.textContent = 'Accept';
      ok.style.cssText = 'cursor:pointer;border:0;border-radius:6px;padding:9px 20px;font:inherit;font-weight:600;background:#fff;color:#111';
      var no = document.createElement('button');
      no.textContent = 'Decline';
      no.style.cssText = 'cursor:pointer;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:9px 20px;font:inherit;background:transparent;color:#fff';
      ok.onclick = function () { choose('granted'); };
      no.onclick = function () { choose('denied'); };
      bar.appendChild(ok); bar.appendChild(no);
      (document.body || document.documentElement).appendChild(bar);
    }
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  })();
</script>
</body>
