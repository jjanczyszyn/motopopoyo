<!DOCTYPE html>
<html lang="en">
<head>
<!-- GA opt-out: visit ?ga_optout=1 to disable analytics in this browser, ?ga_optout=0 to re-enable -->
<script>
  (function () {
    var KEY = 'ga_optout', ID = 'G-ER1JWFY44B';
    try {
      var p = new URLSearchParams(location.search);
      if (p.has(KEY)) {
        if (p.get(KEY) === '0') localStorage.removeItem(KEY);
        else localStorage.setItem(KEY, '1');
      }
      if (localStorage.getItem(KEY) === '1') window['ga-disable-' + ID] = true;
    } catch (e) {}
  })();
</script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ER1JWFY44B"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ER1JWFY44B');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#ff5a3c" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="K&J Moto" />
<title>Karen & JJ Moto Rental</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --ink: #0a0a0a;
    --ink-2: #2b2b2b;
    --muted: #767676;
    --line: #ebebeb;
    --line-2: #f3f3f3;
    --chip: #f5f5f5;
    --accent: #ff5a3c;
    --accent-ink: #ffffff;
    --ok: #16a34a;
    --warn: #b45309;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); }
  body, html { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
  #root { height: 100vh; height: 100dvh; width: 100%; }
  @media (max-width: 700px) {
    /* Phone: kill the centered desktop column and let content go edge-to-edge. */
    body { background: #fff; }
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  .phone-scroll { scrollbar-width: none; }
  .phone-scroll::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
  // Track reach-outs and bookings as GA4 events.
  document.addEventListener('click', function (e) {
    var link = e.target.closest('a[href]');
    if (!link || typeof gtag !== 'function') return;
    var href = link.getAttribute('href') || '';
    if (href.indexOf('wa.me') > -1 || href.indexOf('api.whatsapp') > -1 || link.hasAttribute('data-wa')) {
      gtag('event', 'whatsapp_click', { link_url: href });
    } else if (href.indexOf('mailto:') === 0) {
      gtag('event', 'email_click', { link_url: href });
    } else if (href.indexOf('tel:') === 0) {
      gtag('event', 'tel_click', { link_url: href });
    }
  });
</script>
</body>
</html>
